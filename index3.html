  :root{
    --bg:#0A0A0B; --bg2:#0E0E0F; --card:#151517; --card2:#1C1C1F; --card3:#222226;
    --line:#242428; --line2:#1C1C1F;
    --txt:#FFFFFF; --txt2:#C7C7CC; --txt3:#9A9AA0; --txt4:#6B6B72;
    --gold:#F5C76A; --gold2:#D89B3A; --green:#5BE89A; --red:#F08A6A; --blue:#7FB0E0; --purple:#B79AE0;
    --r-lg:22px; --r-md:16px; --r-sm:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);}
  body{font-family:'Inter',-apple-system,system-ui,sans-serif;color:var(--txt);-webkit-font-smoothing:antialiased;}
  input,select,button,textarea{font-family:inherit;}
  input::placeholder{color:var(--txt4);}
  input[type=number]::-webkit-inner-spin-button{opacity:.2;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#242428;border-radius:4px;}
  button{cursor:pointer;border:none;background:none;color:inherit;}
  .metal{background:linear-gradient(135deg,#2A2A2E 0%,#3C3C42 48%,#1A1A1D 100%);}
  .goldgrad{background:linear-gradient(135deg,var(--gold),var(--gold2));}
  .fade{animation:fade .35s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  .shell{display:flex;min-height:100vh;}
  .sidebar{width:240px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--line2);
    display:flex;flex-direction:column;padding:28px 18px;position:sticky;top:0;height:100vh;}
  .content{flex:1;min-width:0;padding:32px 40px 80px;max-width:1280px;margin:0 auto;width:100%;}
  .bottomnav{display:none;}
  .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .split{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;}

  @media(max-width:1080px){ .g4{grid-template-columns:repeat(2,1fr);} .g3,.g2,.split{grid-template-columns:1fr;} }
  @media(max-width:760px){
    .sidebar{display:none;}
    .content{padding:18px 16px 100px;}
    .g4{grid-template-columns:repeat(2,1fr);gap:10px;}
    .bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(14,14,15,.95);
      backdrop-filter:blur(16px);border-top:1px solid var(--line2);padding:8px 6px 22px;justify-content:space-around;z-index:50;}
    .hero-num{font-size:44px !important;}
    .desktop-only{display:none !important;}
  }
  @media(min-width:761px){ .mobile-only{display:none !important;} }
</style>

function toPragueDate(ts) {

function readDriveStat() {
  try {
    const raw = localStorage.getItem('ds3');
    if (!raw) return null;
    const st = JSON.parse(raw);
    const orders = st.boltData && st.boltData.orders || [];
    const finished = orders.filter(o => o.order_status === 'finished');
    // group by month
    const byMonth = {};
    finished.forEach(o => {
      const ts = o.order_finished_timestamp || o.order_created_timestamp;
      if (!ts) return;
      const mo = toPragueDate(ts).slice(0, 7);
      const earn = o.order_price && o.order_price.net_earnings || 0;
      const km = (o.ride_distance || 0) / 1000;
      if (!byMonth[mo]) byMonth[mo] = {
        gross: 0,
        km: 0,
        trips: 0
      };
      byMonth[mo].gross += earn;
      byMonth[mo].km += km;
      byMonth[mo].trips++;
    });
    // recurring + one-time income from DriveStat
    const recurring = (st.recurringIncome || []).reduce((a, e) => a + (e.amount || 0), 0);

    const thisMonth = byMonth[tMo] || {
      gross: 0,
      km: 0,
      trips: 0
    };
    const last6 = [];
    for (let i = 5; i >= 0; i--) {
      const d = new Date();
      d.setMonth(d.getMonth() - i);
      const mo = d.toISOString().slice(0, 7);
      last6.push({
        mo,
        gross: byMonth[mo] ? byMonth[mo].gross : 0

    }
    return {
      found: true,
      monthGross: thisMonth.gross + recurring,
      boltGross: thisMonth.gross,
      recurring,
      km: thisMonth.km,
      trips: thisMonth.trips,
      dailyGoal: st.settings && st.settings.dailyGoal || 0,
      byMonth,
      last6,
      totalMonths: Object.keys(byMonth).length
    };
  } catch (e) {
    return null;
  }
}
