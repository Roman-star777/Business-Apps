<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Taxi Pro">
<meta name="theme-color" content="#0E0E0E">
<title>Taxi Pro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{height:100%;background:#0E0E0E;}
body{height:100%;background:#0E0E0E;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;color:#fff;overflow:hidden;max-width:430px;margin:0 auto;}
#app{height:100%;display:flex;flex-direction:column;}
header{background:#0E0E0E;padding:14px 20px 12px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;border-bottom:1px solid #1a1a1a;}
.h-logo{font-size:10px;color:#444;letter-spacing:.25em;font-weight:600;}
.h-title{font-size:20px;font-weight:700;color:#fff;margin-top:1px;}
.btn-icon{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;color:#666;padding:8px 14px;font-size:12px;cursor:pointer;font-family:inherit;}
.btn-icon.on{background:#1a1200;border-color:#4a3500;color:#FFC400;}
#settings-panel{background:#111;border-bottom:1px solid #1a1a1a;padding:16px 20px;overflow-y:auto;flex-shrink:0;max-height:55vh;}
.s-sec{font-size:10px;color:#444;letter-spacing:.15em;font-weight:600;margin:14px 0 8px;}
.s-sec:first-child{margin-top:0;}
.s-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.s-field label{font-size:11px;color:#555;display:block;margin-bottom:4px;}
.inp{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;color:#FFC400;padding:9px 12px;font-size:14px;font-family:inherit;width:100%;-webkit-appearance:none;}
.inp-r{text-align:right;}
.save-btn{width:100%;padding:14px;background:#1a1200;border:1.5px solid #FFC400;border-radius:14px;color:#FFC400;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:14px;}
.exp-row{display:flex;gap:8px;margin-top:10px;}
.exp-btn{flex:1;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;color:#666;padding:9px 8px;font-size:11px;cursor:pointer;font-family:inherit;text-align:center;}
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 100px;}
.tab-pane{display:none;padding-top:12px;}
.tab-pane.active{display:block;}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(14,14,14,0.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid #1a1a1a;display:flex;padding:8px 0 max(12px,env(safe-area-inset-bottom));z-index:50;}
.nav-btn{flex:1;background:transparent;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;}
.nav-btn span:first-child{font-size:20px;line-height:1;}
.nav-lbl{font-size:9px;color:#333;letter-spacing:.04em;font-weight:500;}
.nav-btn.active .nav-lbl{color:#FFC400;}
.nav-dot{width:4px;height:4px;border-radius:2px;background:#FFC400;display:none;margin-top:1px;}
.nav-btn.active .nav-dot{display:block;}
.hero{background:#1A1A1A;border:1px solid #2a2a2a;border-radius:20px;padding:18px;margin-bottom:10px;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;top:-30px;right:-30px;width:100px;height:100px;border-radius:50%;background:rgba(255,196,0,0.05);pointer-events:none;}
.hero-lbl{font-size:10px;color:#444;letter-spacing:.15em;font-weight:600;margin-bottom:4px;}
.hero-num{font-size:36px;font-weight:700;color:#FFC400;line-height:1;letter-spacing:-0.02em;}
.hero-sub{font-size:12px;color:#444;margin-top:3px;}
.prog{height:5px;background:#222;border-radius:3px;overflow:hidden;margin:12px 0 5px;}
.prog-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#FFC400,#FF9500);}
.prog-labels{display:flex;justify-content:space-between;font-size:10px;color:#444;}
.prog-labels .hi{color:#FFC400;font-weight:600;}
.be-badge{display:inline-flex;align-items:center;gap:4px;background:#1a1400;border:1px solid #3a3000;border-radius:8px;padding:5px 10px;font-size:11px;color:#FFC400;font-weight:600;margin-top:8px;}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.metric{background:#1A1A1A;border:1px solid #2a2a2a;border-radius:14px;padding:12px 14px;}
.m-lbl{font-size:10px;color:#444;margin-bottom:3px;font-weight:500;letter-spacing:.05em;}
.m-val{font-size:20px;font-weight:700;}
.m-sub{font-size:10px;color:#333;margin-top:1px;}
.card{background:#1A1A1A;border:1px solid #2a2a2a;border-radius:18px;padding:16px;margin-bottom:10px;}
.card-ttl{font-size:10px;color:#444;letter-spacing:.15em;font-weight:600;margin-bottom:12px;}
.day-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #111;}
.day-row:last-child{border-bottom:none;}
.day-date{font-size:13px;font-weight:600;color:#fff;}
.day-sub{font-size:11px;color:#444;margin-top:1px;}
.day-right{display:flex;align-items:center;gap:8px;}
.mini-bw{width:36px;height:3px;background:#222;border-radius:2px;overflow:hidden;}
.mini-bf{height:100%;border-radius:2px;}
.day-num{font-size:14px;font-weight:700;min-width:55px;text-align:right;}
.form-hero{background:#1A1A1A;border:1px solid #2a2a2a;border-radius:20px;padding:18px;margin-bottom:10px;}
.fh-lbl{font-size:10px;color:#444;letter-spacing:.15em;font-weight:600;margin-bottom:12px;}
.big-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.big-field label{font-size:11px;color:#555;display:block;margin-bottom:5px;font-weight:500;}
.big-inp{background:#111;border:1.5px solid #2a2a2a;border-radius:12px;color:#FFC400;padding:12px 14px;font-size:26px;font-weight:700;font-family:inherit;width:100%;text-align:right;-webkit-appearance:none;}
.big-inp:focus{outline:none;border-color:#4a3500;background:#0d0d00;}
.live-box{background:#111;border-radius:12px;padding:12px;}
.live-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;}
.live-lbl{font-size:11px;color:#444;}
.live-val{font-size:12px;font-weight:700;}
.live-div{border:none;border-top:1px solid #1a1a1a;margin:8px 0;}
.live-res{display:flex;justify-content:space-between;align-items:center;}
.live-res-lbl{font-size:12px;color:#666;}
.live-res-val{font-size:24px;font-weight:700;}
.live-km{font-size:11px;color:#444;text-align:right;margin-top:1px;}
.fc{background:#1A1A1A;border:1px solid #2a2a2a;border-radius:16px;padding:14px;margin-bottom:8px;}
.f-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #111;}
.f-row:last-child{border-bottom:none;}
.f-lbl{font-size:13px;color:#666;}
.f-inp{background:#111;border:1px solid #2a2a2a;border-radius:8px;color:#FFC400;padding:8px 10px;font-size:13px;font-family:inherit;width:130px;text-align:right;-webkit-appearance:none;}
.f-inp:focus{outline:none;border-color:#4a3500;}
textarea.f-inp{width:100%;height:54px;resize:none;text-align:left;padding-top:8px;margin-top:6px;}
.btn-save{width:100%;padding:15px;background:#1a1200;border:1.5px solid #FFC400;border-radius:16px;color:#FFC400;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-cancel{padding:15px 18px;background:transparent;border:1px solid #2a2a2a;border-radius:16px;color:#444;font-size:15px;cursor:pointer;font-family:inherit;}
.btn-row{display:flex;gap:8px;margin-top:6px;}
.tc{background:#1A1A1A;border:1px solid #2a2a2a;border-radius:16px;padding:14px;margin-bottom:8px;}
.t-date{font-size:15px;font-weight:700;color:#fff;}
.t-meta{font-size:11px;color:#444;margin-top:2px;}
.t-net{font-size:17px;font-weight:700;}
.t-net-lbl{font-size:10px;color:#333;}
.t-head{display:flex;justify-content:space-between;align-items:flex-start;}
.tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.tag{font-size:10px;border-radius:8px;padding:3px 8px;font-weight:600;}
.ty{background:#1a1400;border:1px solid #3a3000;color:#FFC400;}
.tr{background:#1a0800;border:1px solid #3a1500;color:#ff7043;}
.t-note{font-size:11px;color:#444;margin-top:6px;font-style:italic;}
.t-acts{display:flex;gap:6px;margin-top:10px;}
.bsm{font-size:11px;background:transparent;border-radius:8px;padding:6px 12px;cursor:pointer;font-family:inherit;font-weight:500;}
.be{border:1px solid #2a2a2a;color:#555;}
.bd{border:1px solid #3a1010;color:#e57373;}
.mr{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #111;}
.mr:last-child{border-bottom:none;}
.mn{font-size:13px;font-weight:600;color:#fff;}
.ms{font-size:11px;color:#444;margin-top:1px;}
.mt-tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px;}
.mt-tabs::-webkit-scrollbar{display:none;}
.mt{padding:6px 14px;border-radius:10px;font-size:12px;cursor:pointer;font-family:inherit;border:1px solid #2a2a2a;background:transparent;color:#444;white-space:nowrap;font-weight:500;}
.mt.active{background:#1a1200;border-color:#4a3500;color:#FFC400;}
.pg-title{font-size:17px;font-weight:700;color:#fff;margin-bottom:14px;}
.fl-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.fl-sel{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;color:#FFC400;padding:7px 10px;font-size:12px;font-family:inherit;}
.empty{text-align:center;padding:3rem 1rem;color:#333;font-size:13px;line-height:2;}
.btn-add{margin-top:10px;background:#1a1200;border:1px solid #4a3500;border-radius:12px;color:#FFC400;padding:10px 20px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:600;}
#toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#1a1200;border:1px solid #4a3500;border-radius:12px;color:#FFC400;padding:10px 18px;font-size:13px;font-family:inherit;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;font-weight:600;}
#toast.show{opacity:1;}
.fixed-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #111;}
.fixed-row:last-child{border-bottom:none;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <div class="h-logo">TAXI PRO</div>
      <div class="h-title">Моє таксі 🚕</div>
    </div>
    <button class="btn-icon" id="btn-settings" onclick="toggleSettings()">⚙️ Налаш.</button>
  </header>

  <div id="settings-panel" style="display:none;">
    <div class="s-sec">⛽ АВТО</div>
    <div class="s-grid">
      <div class="s-field"><label>Ціна пального Kč/л</label><input class="inp inp-r" id="s-fuelPrice" type="number" inputmode="decimal" value="41"></div>
      <div class="s-field"><label>Витрата л/100км</label><input class="inp inp-r" id="s-fuelCons" type="number" inputmode="decimal" value="9"></div>
      <div class="s-field"><label>Амортизація Kč/км</label><input class="inp inp-r" id="s-amort" type="number" inputmode="decimal" value="1.5" step="0.1"></div>
    </div>
    <div class="s-sec">💳 ЩОМІСЯЧНІ ВИТРАТИ</div>
    <div class="s-grid">
      <div class="s-field"><label>Кредит за авто Kč</label><input class="inp inp-r" id="s-credit" type="number" inputmode="numeric" value="0"></div>
      <div class="s-field"><label>Страховка авто Kč</label><input class="inp inp-r" id="s-insurance" type="number" inputmode="numeric" value="2000"></div>
      <div class="s-field"><label>Соціалка+підприємець Kč</label><input class="inp inp-r" id="s-social" type="number" inputmode="numeric" value="5000"></div>
      <div class="s-field"><label>Платформа Bolt/Uber Kč</label><input class="inp inp-r" id="s-platform" type="number" inputmode="numeric" value="0"></div>
      <div class="s-field"><label>Інші витрати Kč</label><input class="inp inp-r" id="s-other" type="number" inputmode="numeric" value="1000"></div>
    </div>
    <button class="save-btn" onclick="saveStAndRefresh()">✓ Зберегти налаштування</button>
    <div class="s-sec">📦 РЕЗЕРВНА КОПІЯ</div>
    <div class="exp-row">
      <button class="exp-btn" onclick="exportData()">⬇️ Скачати</button>
      <button class="exp-btn" onclick="document.getElementById('imp-file').click()">⬆️ Відновити</button>
      <input type="file" id="imp-file" accept=".json" style="display:none" onchange="importData(event)">
    </div>
  </div>

  <div id="content">
    <div class="tab-pane active" id="tab-dashboard"></div>
    <div class="tab-pane" id="tab-day"></div>
    <div class="tab-pane" id="tab-history"></div>
    <div class="tab-pane" id="tab-stats"></div>
  </div>

  <nav>
    <button class="nav-btn active" id="nav-dashboard" onclick="showTab('dashboard')">
      <span>📊</span><span class="nav-lbl">Місяць</span><div class="nav-dot"></div>
    </button>
    <button class="nav-btn" id="nav-day" onclick="showTab('day')">
      <span>➕</span><span class="nav-lbl">День</span><div class="nav-dot"></div>
    </button>
    <button class="nav-btn" id="nav-history" onclick="showTab('history')">
      <span>📋</span><span class="nav-lbl">Історія</span><div class="nav-dot"></div>
    </button>
    <button class="nav-btn" id="nav-stats" onclick="showTab('stats')">
      <span>📈</span><span class="nav-lbl">Статистика</span><div class="nav-dot"></div>
    </button>
  </nav>
</div>
<div id="toast">✓ Збережено</div>

<script>
let history=[],editingId=null,selectedMonth=todayMonth();
let dayData={date:today(),earnings:0,km:0,note:""};
let currentTab="dashboard";

function today(){return new Date().toISOString().split("T")[0];}
function todayMonth(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;}
function fmt(n){return Math.round(n).toLocaleString("cs-CZ");}
function fmtD(n){return(n>=0?"+":"")+fmt(n);}

function getSt(){return{fuelPrice:parseFloat(document.getElementById("s-fuelPrice")?.value)||41,fuelCons:parseFloat(document.getElementById("s-fuelCons")?.value)||9,amort:parseFloat(document.getElementById("s-amort")?.value)||1.5,credit:parseInt(document.getElementById("s-credit")?.value)||0,insurance:parseInt(document.getElementById("s-insurance")?.value)||2000,social:parseInt(document.getElementById("s-social")?.value)||5000,platform:parseInt(document.getElementById("s-platform")?.value)||0,other:parseInt(document.getElementById("s-other")?.value)||1000};}
function mf(){const s=getSt();return s.credit+s.insurance+s.social+s.platform+s.other;}
function calcVar(km){const s=getSt();const fuel=(km/100)*s.fuelCons*s.fuelPrice;const amort=km*s.amort;return{fuel,amort,total:fuel+amort};}

function loadSettings(){
  const sv=JSON.parse(localStorage.getItem("taxi-settings")||"{}");
  if(!sv.fuelPrice)return;
  const mp={fuelPrice:"s-fuelPrice",fuelCons:"s-fuelCons",amort:"s-amort",credit:"s-credit",insurance:"s-insurance",social:"s-social",platform:"s-platform",other:"s-other"};
  for(const[k,id]of Object.entries(mp)){const el=document.getElementById(id);if(el&&sv[k]!==undefined)el.value=sv[k];}
}
function saveSt(){localStorage.setItem("taxi-settings",JSON.stringify(getSt()));}
function saveStAndRefresh(){
  saveSt();renderDashboard();
  if(currentTab==="stats")renderStats();
  showToast("✓ Налаштування збережено");
  document.getElementById("settings-panel").style.display="none";
  document.getElementById("btn-settings").classList.remove("on");
}
function toggleSettings(){
  const p=document.getElementById("settings-panel");
  const hidden=p.style.display==="none";
  p.style.display=hidden?"block":"none";
  document.getElementById("btn-settings").classList.toggle("on",hidden);
}

function showTab(name){
  document.querySelectorAll(".tab-pane").forEach(t=>t.classList.remove("active"));
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
  document.getElementById("tab-"+name).classList.add("active");
  document.getElementById("nav-"+name).classList.add("active");
  currentTab=name;
  if(name==="day"&&!editingId)resetDayForm();
  if(name==="dashboard")renderDashboard();
  if(name==="history")renderHistory();
  if(name==="stats")renderStats();
  if(name==="day")renderDayForm();
  document.getElementById("content").scrollTop=0;
}

function renderDashboard(){
  const fixed=mf();const s=getSt();
  const trips=history.filter(t=>t.date&&t.date.startsWith(selectedMonth));
  const mE=trips.reduce((s,t)=>s+(t.earnings||0),0);
  const mV=trips.reduce((s,t)=>s+(t.varCosts||0),0);
  const mK=trips.reduce((s,t)=>s+(t.km||0),0);
  const mM=mE-mV;const mN=mM-fixed;
  const fL=Math.max(0,fixed-mM);const bE=mM>=fixed;
  const pct=fixed>0?Math.min(100,(mM/fixed)*100):0;
  const wd=trips.length;const avg=wd>0?Math.round(mN/wd):0;

  const months=[...new Set(history.map(t=>t.date?.slice(0,7)).filter(Boolean))].sort().reverse();
  if(!months.includes(selectedMonth))months.unshift(selectedMonth);
  const mTabs=months.slice(0,5).map(m=>`<button class="mt ${m===selectedMonth?"active":""}" onclick="setMonth('${m}')">${m===selectedMonth?"📅 "+m:m}</button>`).join("");

  const daysH=trips.slice(0,6).map(t=>{
    const n=t.net||0;const bw=Math.min(100,Math.max(0,((t.earnings||0)-(t.varCosts||0))/(avg||2000)*80));
    return`<div class="day-row"><div><div class="day-date">${t.date?.slice(5).replace("-",".")}</div><div class="day-sub">${fmt(t.km||0)} км · ${fmt(t.earnings||0)} Kč</div></div><div class="day-right"><div class="mini-bw"><div class="mini-bf" style="width:${bw}%;background:${n>=0?"#FFC400":"#f44336"};"></div></div><div class="day-num" style="color:${n>=0?"#FFC400":"#f44336"}">${fmtD(n)}</div></div></div>`;
  }).join("");

  const fxRows=Object.entries({credit:"Кредит за авто",insurance:"Страховка авто",social:"Соціалка + підприємець",platform:"Платформа",other:"Інші витрати"}).filter(([k])=>s[k]>0).map(([k,l])=>`<div class="fixed-row"><span style="font-size:13px;color:#666;">${l}</span><span style="font-size:13px;font-weight:700;color:${bE?"#4CAF50":"#f44336"};">−${fmt(s[k])} Kč</span></div>`).join("")+`<div style="display:flex;justify-content:space-between;padding-top:10px;"><span style="font-size:14px;font-weight:600;color:#555;">Всього</span><span style="font-size:14px;font-weight:700;color:#f44336;">−${fmt(fixed)} Kč</span></div>`;

  document.getElementById("tab-dashboard").innerHTML=`
    <div class="mt-tabs">${mTabs}</div>
    <div class="hero">
      <div class="hero-lbl">ЧИСТИЙ ПРИБУТОК · ${selectedMonth}</div>
      <div class="hero-num">${mN>=0?"+":""}${fmt(mN)}</div>
      <div class="hero-sub">Kč · ${wd} ${wd===1?"день":wd<5?"дні":"днів"} · ${fmt(mK)} км</div>
      <div class="prog"><div class="prog-fill" style="width:${pct.toFixed(0)}%;"></div></div>
      <div class="prog-labels"><span>0</span><span class="hi">${Math.round(pct)}% покрито</span><span>${fmt(fixed)}</span></div>
      <div class="be-badge">${bE?"✅ Фіксовані покриті — все в прибуток":"⏳ До покриття: "+fmt(fL)+" Kč"}</div>
    </div>
    <div class="metrics">
      <div class="metric"><div class="m-lbl">ВИРУЧКА</div><div class="m-val" style="color:#FFC400;">+${fmt(mE)}</div><div class="m-sub">Kč</div></div>
      <div class="metric"><div class="m-lbl">ВИТРАТИ</div><div class="m-val" style="color:#f44336;">−${fmt(mV)}</div><div class="m-sub">Kč пальне+амортиз.</div></div>
      <div class="metric"><div class="m-lbl">МАРЖА</div><div class="m-val" style="color:#4acfef;">${fmt(mM)}</div><div class="m-sub">Kč до фіксованих</div></div>
      <div class="metric"><div class="m-lbl">СЕРЕДНІЙ ДЕНЬ</div><div class="m-val" style="color:${avg>=0?"#FFC400":"#f44336"}">${fmtD(avg)}</div><div class="m-sub">Kč</div></div>
    </div>
    ${trips.length>0?`<div class="card"><div class="card-ttl">ОСТАННІ ДНІ</div>${daysH}</div>`:""}
    <div class="card"><div class="card-ttl">ФІКСОВАНІ ВИТРАТИ · ${selectedMonth}</div>${fxRows}</div>
    ${trips.length===0?`<div class="empty">Немає записів у ${selectedMonth}<br><button class="btn-add" onclick="showTab('day')">+ Додати перший день</button></div>`:""}
  `;
}

function setMonth(m){selectedMonth=m;renderDashboard();}

function resetDayForm(){editingId=null;dayData={date:today(),earnings:0,km:0,note:""};}

function renderDayForm(){
  const d=dayData;
  document.getElementById("tab-day").innerHTML=`
    <div class="pg-title">${editingId?"Редагувати день":"Додати день"}</div>
    <div class="form-hero">
      <div class="fh-lbl">ВВЕДИ ДАНІ ЗА ДЕНЬ</div>
      <div class="big-grid">
        <div class="big-field"><label>💰 Виручка Kč</label><input class="big-inp" id="f-earnings" type="number" inputmode="numeric" placeholder="0" value="${d.earnings||""}" oninput="dayData.earnings=+this.value;updateLive()"></div>
        <div class="big-field"><label>🛣️ Пробіг км</label><input class="big-inp" id="f-km" type="number" inputmode="numeric" placeholder="0" value="${d.km||""}" oninput="dayData.km=+this.value;updateLive()"></div>
      </div>
      <div class="live-box" id="live-box"></div>
    </div>
    <div class="fc"><div class="f-row"><span class="f-lbl">Дата</span><input class="f-inp" type="date" value="${d.date}" oninput="dayData.date=this.value"></div></div>
    <div class="fc"><div style="font-size:11px;color:#444;margin-bottom:6px;font-weight:600;letter-spacing:.1em;">НОТАТКА</div><textarea class="f-inp" style="width:100%;height:54px;resize:none;text-align:left;padding-top:8px;" oninput="dayData.note=this.value">${d.note||""}</textarea></div>
    <div class="btn-row">
      <button class="btn-save" onclick="saveDay()">${editingId?"✓ Зберегти зміни":"✓ Зберегти день"}</button>
      ${editingId?`<button class="btn-cancel" onclick="cancelEdit()">✕</button>`:""}
    </div>
  `;
  updateLive();
}

function updateLive(){
  const d=dayData;const cv=calcVar(d.km);const net=d.earnings-cv.total;
  const isG=net>0;const pk=d.km>0?(net/d.km).toFixed(1):"0";
  const el=document.getElementById("live-box");if(!el)return;
  el.innerHTML=`
    <div class="live-row"><span class="live-lbl">Виручка</span><span class="live-val" style="color:#FFC400;">+${fmt(d.earnings)} Kč</span></div>
    <div class="live-row"><span class="live-lbl">Пальне</span><span class="live-val" style="color:#f44336;">−${fmt(cv.fuel)} Kč</span></div>
    <div class="live-row"><span class="live-lbl">Амортизація</span><span class="live-val" style="color:#f44336;">−${fmt(cv.amort)} Kč</span></div>
    <hr class="live-div">
    <div class="live-res"><span class="live-res-lbl">Чисті за день</span><div><div class="live-res-val" style="color:${isG?"#FFC400":"#f44336"}">${fmtD(net)} Kč</div><div class="live-km">${pk} Kč/км</div></div></div>`;
}

function saveDay(){
  const d=dayData;const cv=calcVar(d.km);const net=d.earnings-cv.total;
  const entry={id:editingId||Date.now().toString(),date:d.date,earnings:d.earnings,km:d.km,varCosts:cv.total,fuelCost:cv.fuel,amortCost:cv.amort,net,note:d.note||""};
  if(editingId){history=history.map(h=>h.id===editingId?entry:h);}
  else{const ex=history.find(h=>h.date===d.date);if(ex&&!confirm(`За ${d.date} вже є запис. Додати ще один?`))return;history=[entry,...history];}
  history.sort((a,b)=>b.date.localeCompare(a.date));
  localStorage.setItem("taxi-history",JSON.stringify(history));
  showToast();editingId=null;resetDayForm();showTab("dashboard");
}
function cancelEdit(){editingId=null;resetDayForm();showTab("history");}

function renderHistory(){
  const months=[...new Set(history.map(t=>t.date?.slice(0,7)).filter(Boolean))].sort().reverse();
  const filtered=selectedMonth?history.filter(t=>t.date?.startsWith(selectedMonth)):history;
  const sel=`<select class="fl-sel" onchange="filterMonth(this.value)"><option value="">Всі</option>${months.map(m=>`<option value="${m}" ${m===selectedMonth?"selected":""}>${m}</option>`).join("")}</select>`;
  const cards=filtered.length===0?`<div class="empty">Записів ще немає</div>`:filtered.map(t=>`
    <div class="tc">
      <div class="t-head"><div><div class="t-date">${t.date||""}</div><div class="t-meta">${fmt(t.km||0)} км · ${fmt(t.earnings||0)} Kč виручка</div></div><div><div class="t-net" style="color:${(t.net||0)>=0?"#FFC400":"#f44336"}">${fmtD(t.net||0)}</div><div class="t-net-lbl">Kč чистими</div></div></div>
      <div class="tags"><span class="tag ty">+${fmt(t.earnings||0)}</span><span class="tag tr">−${fmt(t.fuelCost||0)} пальне</span></div>
      ${t.note?`<div class="t-note">${t.note}</div>`:""}
      <div class="t-acts"><button class="bsm be" onclick="editDay('${t.id}')">✏️ Редаг.</button><button class="bsm bd" onclick="deleteDay('${t.id}')">🗑️ Видалити</button></div>
    </div>`).join("");
  document.getElementById("tab-history").innerHTML=`<div class="fl-row"><div class="pg-title" style="margin-bottom:0;">Записи (${filtered.length})</div>${sel}</div>${cards}`;
}
function filterMonth(m){selectedMonth=m;renderHistory();}
function editDay(id){const t=history.find(h=>h.id===id);if(!t)return;editingId=id;dayData={date:t.date||today(),earnings:t.earnings||0,km:t.km||0,note:t.note||""};showTab("day");}
function deleteDay(id){if(!confirm("Видалити?"))return;history=history.filter(h=>h.id!==id);localStorage.setItem("taxi-history",JSON.stringify(history));renderHistory();renderDashboard();}

function renderStats(){
  const fixed=mf();
  const aN=history.reduce((s,t)=>s+(t.net||0),0);
  const aE=history.reduce((s,t)=>s+(t.earnings||0),0);
  const aK=history.reduce((s,t)=>s+(t.km||0),0);
  const avgN=history.length?Math.round(aN/history.length):0;
  const avgE=history.length?Math.round(aE/history.length):0;
  const months=[...new Set(history.map(t=>t.date?.slice(0,7)).filter(Boolean))].sort().reverse();
  const mRows=months.map(m=>{
    const mt=history.filter(t=>t.date?.startsWith(m));
    const me=mt.reduce((s,t)=>s+(t.earnings||0),0);
    const mv=mt.reduce((s,t)=>s+(t.varCosts||0),0);
    const mk=mt.reduce((s,t)=>s+(t.km||0),0);
    const mn=me-mv-fixed;
    return`<div class="mr"><div><div class="mn">${m}</div><div class="ms">${mt.length} днів · ${fmt(mk)} км · ${fmt(me)} Kč</div></div><div style="font-size:15px;font-weight:700;color:${mn>=0?"#FFC400":"#f44336"}">${fmtD(mn)}</div></div>`;
  }).join("");
  document.getElementById("tab-stats").innerHTML=`
    <div class="pg-title">Загальна статистика</div>
    <div class="metrics">
      <div class="metric"><div class="m-lbl">РОБОЧИХ ДНІВ</div><div class="m-val" style="color:#FFC400;">${history.length}</div></div>
      <div class="metric"><div class="m-lbl">ПРОБІГ</div><div class="m-val" style="color:#fff;">${fmt(aK)}</div><div class="m-sub">км</div></div>
      <div class="metric"><div class="m-lbl">ВИРУЧКА</div><div class="m-val" style="color:#FFC400;">${fmt(aE)}</div><div class="m-sub">Kč</div></div>
      <div class="metric"><div class="m-lbl">ПРИБУТОК</div><div class="m-val" style="color:${aN>=0?"#FFC400":"#f44336"}">${fmtD(aN)}</div><div class="m-sub">Kč</div></div>
      <div class="metric"><div class="m-lbl">СЕРЕДНІЙ ДЕНЬ</div><div class="m-val" style="color:#fff;">${fmtD(avgN)}</div><div class="m-sub">Kč чистими</div></div>
      <div class="metric"><div class="m-lbl">ВИРУЧКА/ДЕНЬ</div><div class="m-val" style="color:#FFC400;">${fmt(avgE)}</div><div class="m-sub">Kč</div></div>
    </div>
    ${months.length>0?`<div class="card"><div class="card-ttl">ПО МІСЯЦЯХ</div>${mRows}</div>`:""}
    ${history.length===0?`<div class="empty">Додай перший день щоб побачити статистику</div>`:""}`;
}

function exportData(){const data={settings:getSt(),history};const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`taxi-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();}
function importData(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=ev=>{try{const data=JSON.parse(ev.target.result);if(data.history){history=data.history;localStorage.setItem("taxi-history",JSON.stringify(history));}if(data.settings){localStorage.setItem("taxi-settings",JSON.stringify(data.settings));loadSettings();}showToast("✓ Дані відновлено");renderDashboard();}catch(err){alert("Помилка: "+err.message);}};r.readAsText(file);}
function showToast(msg){const t=document.getElementById("toast");t.textContent=msg||"✓ Збережено";t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2500);}

loadSettings();
history=JSON.parse(localStorage.getItem("taxi-history")||"[]");
renderDashboard();renderDayForm();
</script>
</body>
</html>
