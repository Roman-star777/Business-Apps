<meta charset="UTF-8" />

<title>Finanční kokpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
  :root{
    --bg:#0B0B0C; --bg2:#0E0E0F; --card:#141416; --card2:#1A1A1D;
    --line:#222226; --line2:#1C1C1F;
    --txt:#FFFFFF; --txt2:#C7C7CC; --txt3:#9A9AA0; --txt4:#6B6B72;
    --gold:#F5C76A; --gold2:#D89B3A; --green:#5BE89A; --red:#F87171;
    --r-lg:24px; --r-md:18px; --r-sm:13px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--txt);-webkit-font-smoothing:antialiased;}
  input,select,button{font-family:inherit;}
  input::placeholder{color:var(--txt4);}
  input[type=number]::-webkit-inner-spin-button{opacity:.25;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#222226;border-radius:4px;}
  button{cursor:pointer;border:none;background:none;color:inherit;}
  .metal{background:linear-gradient(135deg,#2A2A2E 0%,#3C3C42 50%,#1A1A1D 100%);}
  .goldgrad{background:linear-gradient(135deg,var(--gold),var(--gold2));}

  /* layout */
  .shell{display:flex;min-height:100vh;}
  .sidebar{width:248px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--line2);
    display:flex;flex-direction:column;padding:32px 20px;position:sticky;top:0;height:100vh;}
  .content{flex:1;min-width:0;padding:32px 40px 60px;max-width:1240px;margin:0 auto;width:100%;}
  .bottomnav{display:none;}

  .cards-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  .cards-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .hero-row{display:grid;grid-template-columns:1.05fr 1fr;gap:20px;}

  @media(max-width:1080px){
    .cards-4{grid-template-columns:repeat(2,1fr);}
    .hero-row,.cards-2{grid-template-columns:1fr;}
  }
  @media(max-width:760px){
    .sidebar{display:none;}
    .content{padding:18px 16px 96px;}
    .cards-4{grid-template-columns:repeat(2,1fr);gap:10px;}
    .bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(14,14,15,.94);
      backdrop-filter:blur(14px);border-top:1px solid var(--line2);padding:8px 8px 22px;justify-content:space-around;z-index:50;}
    .desktop-only{display:none !important;}
    .hero-num{font-size:46px !important;}
  }
  @media(min-width:761px){ .mobile-only{display:none !important;} }
</style>
</head>

/* ================= calc helpers ================= */
function useCalc(state) {
  return useMemo(() => {
    const incomeTotal = state.incomes.reduce((s, i) => s + incomeValue(i), 0);
    const expenseTotal = state.expenses.reduce((s, e) => s + (e.monthly || 0), 0);
    const buffer = expenseTotal * (state.settings.bufferPct / 100);
    const obligatory = state.expenses.filter(e => ["carloan", "loan"].includes(e.category)).reduce((s, e) => s + (e.monthly || 0), 0);
    const net = incomeTotal - expenseTotal;
    const margin = incomeTotal > 0 ? net / incomeTotal * 100 : 0;
    const debtRatio = incomeTotal > 0 ? obligatory / incomeTotal * 100 : 0;
    const needPerMonth = expenseTotal + buffer + state.settings.restGoal;
    const needPerDay = needPerMonth / (state.settings.workDays || 22);
    const totalDebt = state.expenses.filter(e => e.balance).reduce((s, e) => s + (e.balance || 0), 0);
    // journal: today + 30-day series
    const j = state.journal || [];
    const today = todayISO();
    const earnedToday = j.filter(x => x.date === today).reduce((s, x) => s + (x.amount || 0), 0);
    const days = [];
    for (let i = 29; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const iso = d.toISOString().slice(0, 10);
      const sum = j.filter(x => x.date === iso).reduce((s, x) => s + (x.amount || 0), 0);
      days.push({
        iso,
        label: d.getDate(),
        sum
      });
    }
    const month30 = days.reduce((s, d) => s + d.sum, 0);
    return {
      incomeTotal,
      expenseTotal,
      buffer,
      obligatory,
      net,
      margin,
      debtRatio,
      needPerMonth,
      needPerDay,
      totalDebt,
      earnedToday,
      days,
      month30
    };
  }, [state]);
}
